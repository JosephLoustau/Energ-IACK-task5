<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-label="DeCathlon Genève">
  <!-- Couleurs du logo de la Ville de Genève (public/ville-geneve.svg) : rouge #CC3333, jaune #FFCD00, noir #2E2A25.
       Police : Avenir Black, la plus proche du lettrage « Ville de Genève ». -->
  <rect x="304" y="30" width="300" height="300" fill="#fbeeee" stroke="#cc3333" stroke-opacity=".45" stroke-width="3"/>
  <rect x="604" y="330" width="300" height="300" fill="#fffae6" stroke="#ffcd00" stroke-width="3"/>
  <g font-family="Avenir" font-weight="900" font-size="180" letter-spacing="10">
    <g fill="#2e2a25">
      <text x="40" y="258">De</text>
      <text x="618" y="258">thlon</text>
      <text x="918" y="558">nève</text>
    </g>
    <text x="459" y="258" text-anchor="middle" fill="#cc3333">Ca</text>
    <text x="759" y="558" text-anchor="middle" fill="#ffcd00">Ge</text>
    <text x="586" y="86" font-size="46" font-weight="800" letter-spacing="0" text-anchor="end" fill="#cc3333">20</text>
    <text x="886" y="386" font-size="46" font-weight="800" letter-spacing="0" text-anchor="end" fill="#ffcd00">32</text>
  </g>
</svg>
